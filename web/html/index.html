<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente de documentación</title>
  <style>
    :root { --bg: #f7f7f8; --fg: #1d1d1f; --muted: #6b6b73; --card: #fff; --accent: #0f62fe; --border: #e2e2e6; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141416; --fg: #ececf1; --muted: #9a9aa3; --card: #1e1e22; --accent: #78a9ff; --border: #2e2e34; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 24px; }
    form { display: flex; gap: 8px; }
    textarea { flex: 1; resize: vertical; min-height: 48px; padding: 12px; font: inherit;
      border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--fg); }
    button { padding: 0 20px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #resultado { margin-top: 24px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .aviso { color: var(--muted); font-style: italic; }
    .citas { margin-top: 12px; font-size: .9rem; }
    .citas li { margin-bottom: 6px; }
    .fuente { font-family: ui-monospace, monospace; }
    .error { color: #d12; }
  </style>
</head>
<body>
  <main>
    <h1>Asistente de documentación</h1>
    <p class="sub">Pregunta sobre los documentos de la empresa a los que tienes acceso.</p>
    <form id="form">
      <textarea id="pregunta" maxlength="2000" required placeholder="¿Cuántos días de vacaciones tengo?"></textarea>
      <button id="enviar" type="submit">Preguntar</button>
    </form>
    <section id="resultado" aria-live="polite"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
