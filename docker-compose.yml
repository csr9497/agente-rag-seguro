# Entorno local: backend + web + Qdrant. Embeddings y LLM: Azure OpenAI u OpenAI/compatible
# (MODELOS_PROVEEDOR en .env; ver docs/modelos.md).
#   docker compose up --build
#   docker compose run --rm ingest        # indexa ingestor/sample_docs en Qdrant
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"  # solo este equipo: Qdrant no aplica los permisos por grupo
    volumes:
      - qdrant_data:/qdrant/storage

  # Base de datos de la app (como en Azure). Row Level Security en hr_cases y tickets.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agente
      POSTGRES_USER: agente_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:55432:5432"  # 5432 suele estar ocupado por otros Postgres locales
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agente_app -d agente"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"  # solo este equipo

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      IDENTIDAD_DEBUG: "true"   # permite probar permisos con X-Usuario-Grupos en local
      EXPONER_TOPOLOGIA: "true" # http://localhost:8000/grafo
      GESTION_DOCUMENTOS: "true" # /documentos (editores: X-Usuario-Grupos: editores,<grupo>)
      # Sin Entra ID: el rol se elige en la interfaz (solo local).
      SELECCION_LIBRE_DE_ROL: "true"
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://agente_app:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@postgres:5432/agente
      # Originales de los documentos en el volumen (la imagen no es escribible por appuser).
      ALMACEN_LOCAL_DIR: /data/documentos
      # Sin az login en el contenedor: solo guardrails locales (Prompt Shields, fuera de Docker).
      CONTENT_SAFETY_ENDPOINT: ""
    extra_hosts:
      # Endpoints compatibles en el host (Ollama, vLLM): OPENAI_BASE_URL=http://host.docker.internal:…
      - "host.docker.internal:host-gateway"
    volumes:
      # Carpeta del proyecto (no volumen): LangGraph Studio (`make studio`, en el host) usa la
      # misma base de datos y registro de permisos que la app.
      - ./data:/data
    ports:
      # Solo este equipo: con IDENTIDAD_DEBUG la cabecera X-Usuario-Grupos elige los grupos.
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started

  web:
    build: ./web
    environment:
      BACKEND_URL: http://app:8000
      PROXY_SECRETO: "" # solo en Azure (AUTH_MODO=easyauth)
    ports:
      # Solo este equipo: sin autenticación, desde la red cualquiera podría subir o borrar.
      - "127.0.0.1:8080:8080"
    depends_on:
      - app

  ingest:
    build: .
    profiles: ["tools"]
    command: ["python", "-m", "ingestor.ingest", "--source", "local", "--path", "ingestor/sample_docs"]
    env_file:
      - path: .env
        required: false
    environment:
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      # Mismo registro y almacén que la app: lo indexado queda visible con sus permisos.
      DATABASE_URL: postgresql+psycopg://agente_app:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@postgres:5432/agente
      ALMACEN_LOCAL_DIR: /data/documentos
      CONTENT_SAFETY_ENDPOINT: ""
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  qdrant_data:
  postgres_data:
