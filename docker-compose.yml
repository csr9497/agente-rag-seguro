# Entorno local: backend + web + Qdrant. Embeddings y LLM en Azure OpenAI (.env).
#   docker compose up --build
#   docker compose run --rm ingest        # indexa ingestor/sample_docs en Qdrant
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"  # solo este equipo: Qdrant no aplica los permisos por grupo
    volumes:
      - qdrant_data:/qdrant/storage

  # Opcional (paridad con Azure): docker compose --profile postgres up -d postgres
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: agente
      POSTGRES_USER: agente_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:55432:5432"  # 5432 suele estar ocupado por otros Postgres locales
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"  # solo este equipo

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      IDENTIDAD_DEBUG: "true"   # permite probar permisos con X-Usuario-Grupos en local
      EXPONER_TOPOLOGIA: "true" # http://localhost:8000/grafo
      GESTION_DOCUMENTOS: "true" # /documentos (editores: X-Usuario-Grupos: editores,<grupo>)
      # Sin Entra ID: el rol se elige en la interfaz (solo local).
      SELECCION_LIBRE_DE_ROL: "true"
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:////data/app.db
      # Originales de los documentos en el volumen (la imagen no es escribible por appuser).
      ALMACEN_LOCAL_DIR: /data/documentos
      # Sin az login en el contenedor: solo guardrails locales (Prompt Shields, fuera de Docker).
      CONTENT_SAFETY_ENDPOINT: ""
    volumes:
      - app_data:/data
    ports:
      # Solo este equipo: con IDENTIDAD_DEBUG la cabecera X-Usuario-Grupos elige los grupos.
      - "127.0.0.1:8000:8000"
    depends_on:
      - qdrant
      - redis

  web:
    build: ./web
    environment:
      BACKEND_URL: http://app:8000
    ports:
      # Solo este equipo: sin autenticación, desde la red cualquiera podría subir o borrar.
      - "127.0.0.1:8080:8080"
    depends_on:
      - app

  ingest:
    build: .
    profiles: ["tools"]
    command: ["python", "-m", "ingestor.ingest", "--source", "local", "--path", "ingestor/sample_docs"]
    env_file:
      - path: .env
        required: false
    environment:
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant

volumes:
  qdrant_data:
  app_data:
  postgres_data:
