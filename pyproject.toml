[project]
name = "agente-rag"
version = "0.1.0"
description = "Asistente RAG agéntico seguro (Fase 1: RAG básico)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "openai",                  # Azure OpenAI (AzureOpenAI client)
    "azure-identity",          # Managed Identity / DefaultAzureCredential
    "qdrant-client",           # vector store local
    "azure-search-documents",  # vector store en Azure (security trimming)
    "azure-storage-blob",      # origen de documentos para la ingesta en Azure
    "langgraph>=1.2.12",
    "python-multipart",        # subida de documentos (UploadFile) en la API
    "sqlalchemy",              # repositorios: mismo SQL para SQLite (local) y PostgreSQL (Azure)
    "langsmith",               # trazas y evaluaciones (ya dependencia de LangGraph; uso directo)
    "psycopg[binary]",         # PostgreSQL en Azure (DATABASE_URL postgresql+psycopg)
    "pyjwt[crypto]",           # validación de tokens de Entra ID (RS256 + JWKS)
    "redis",                   # caché semántica compartida (Azure Cache for Redis)
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",   # TestClient de FastAPI y cliente de las pruebas de integración
    "pyyaml",  # matriz de escenarios de integración
    "ruff",
    "langgraph-cli[inmem]>=0.4.32",
    "fakeredis",  # tests de la caché en Redis sin servidor
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration'"
filterwarnings = [
    "ignore:Payload indexes have no effect in the local Qdrant",
    "ignore:langsmith.wrappers._openai_agents is deprecated",  # plugin interno de langsmith
]
markers = [
    "integration: pruebas contra un despliegue real (local o Azure); requieren INTEGRATION_BASE_URL",
    "postgres: paridad con PostgreSQL; requieren TEST_DATABASE_URL",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
