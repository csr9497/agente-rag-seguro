name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - name: Informe de cobertura de la matriz de integración
        run: uv run python -m tests.integration.evaluador >> "$GITHUB_STEP_SUMMARY"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra
      - name: validate
        run: |
          for stack in platform apps; do
            terraform -chdir=infra/$stack init -backend=false -input=false
            terraform -chdir=infra/$stack validate
          done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: false
