name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRAZAS_MODO: apagado # CI nunca envía trazas a LangSmith

jobs:
  python:
    name: Lint y tests unitarios
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - name: Cobertura declarada de la matriz de escenarios
        run: uv run python -m tests.integration.evaluador >> "$GITHUB_STEP_SUMMARY"

  postgres:
    name: Paridad con PostgreSQL
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agente
          POSTGRES_USER: agente_app
          POSTGRES_PASSWORD: solo-para-ci # base efímera del runner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agente_app -d agente"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/test_postgres.py -v
        env:
          TEST_DATABASE_URL: postgresql+psycopg://agente_app:solo-para-ci@localhost:5432/agente

  evaluaciones:
    name: Gate de evaluaciones (seguridad, contrato, recuperación)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: App con composición real y modelos simulados
        # Con el Python de la .venv (no `uv run`): un `uv run` en segundo plano retiene el
        # candado de la caché de uv y bloquea el post-step de setup-uv.
        run: |
          .venv/bin/python -m uvicorn tests.integration.servidor_simulado:app --port 8767 > servidor.log 2>&1 &
          echo $! > servidor.pid
          for i in $(seq 1 30); do curl -sf localhost:8767/api/health && break; sleep 1; done
      - name: Evaluaciones por capas (falla si hay fugas entre roles o contrato roto)
        run: uv run python -m evals.ejecutar --base-url http://localhost:8767/api --salida reports/evaluacion.md
      - name: Informe
        if: always()
        run: cat reports/evaluacion.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Parar la app
        if: always()
        run: kill "$(cat servidor.pid)" || true

  terraform:
    name: Terraform (fmt, validate, test con providers simulados)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive infra
      - name: validate
        run: |
          for stack in platform identidad apps; do
            terraform -chdir=infra/$stack init -backend=false -input=false
            terraform -chdir=infra/$stack validate
          done
      - name: test de flags (sin credenciales ni llamadas a Azure)
        run: |
          terraform -chdir=infra/platform test
          terraform -chdir=infra/apps test

  docker:
    name: Build de imágenes
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
      - uses: docker/build-push-action@v7
        with:
          context: web
          push: false
