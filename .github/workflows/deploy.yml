name: Deploy

# Despliegue completo en Azure: infraestructura (platform) → imágenes → aplicaciones (apps).
# Autenticación con OIDC (sin secretos); variables creadas por infra/bootstrap/bootstrap.sh.
#
# Desactivado hasta que se decida desplegar: requiere la variable de repositorio
# DEPLOY_AZURE=true (Settings → Variables). Sin ella, todos los jobs se omiten.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_ingest:
        description: Ejecutar el job de ingesta al terminar
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: "true"
  BACKEND_CONFIG: >-
    -backend-config=resource_group_name=${{ vars.TFSTATE_RG }}
    -backend-config=storage_account_name=${{ vars.TFSTATE_ACCOUNT }}
    -backend-config=container_name=${{ vars.TFSTATE_CONTAINER }}
    -backend-config=use_azuread_auth=true
    -backend-config=use_oidc=true

jobs:
  platform:
    if: vars.DEPLOY_AZURE == 'true'
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      alcance: ${{ steps.out.outputs.alcance }}
      acr_name: ${{ steps.out.outputs.acr_name }}
      acr_login_server: ${{ steps.out.outputs.acr_login_server }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: terraform apply (platform)
        working-directory: infra/platform
        run: |
          terraform init -input=false $BACKEND_CONFIG -backend-config=key=dev/platform.tfstate
          terraform apply -input=false -auto-approve -var-file=../envs/dev/platform.tfvars
        env:
          TF_VAR_langsmith_api_key: ${{ secrets.LANGSMITH_API_KEY }}
      - id: out
        working-directory: infra/platform
        run: |
          echo "alcance=$(terraform output -raw alcance)" >> "$GITHUB_OUTPUT"
          echo "acr_name=$(terraform output -raw acr_name)" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"

  images:
    needs: platform
    if: vars.DEPLOY_AZURE == 'true' && needs.platform.outputs.alcance == 'completo'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name ${{ needs.platform.outputs.acr_name }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ needs.platform.outputs.acr_login_server }}/backend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ${{ needs.platform.outputs.acr_login_server }}/web:${{ github.sha }}

  apps:
    needs: [platform, images]
    if: vars.DEPLOY_AZURE == 'true' && needs.platform.outputs.alcance == 'completo'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: terraform apply (apps)
        working-directory: infra/apps
        env:
          REGISTRY: ${{ needs.platform.outputs.acr_login_server }}
        run: |
          terraform init -input=false $BACKEND_CONFIG -backend-config=key=dev/apps.tfstate
          terraform apply -input=false -auto-approve \
            -var-file=../envs/dev/apps.tfvars \
            -var="backend_image=${REGISTRY}/backend:${GITHUB_SHA}" \
            -var="web_image=${REGISTRY}/web:${GITHUB_SHA}" \
            -var="app_version=${GITHUB_SHA}" \
            -var='platform_state={resource_group_name="${{ vars.TFSTATE_RG }}",storage_account_name="${{ vars.TFSTATE_ACCOUNT }}",container_name="${{ vars.TFSTATE_CONTAINER }}",key="dev/platform.tfstate"}'
          echo "### Web: $(terraform output -raw web_url)" >> "$GITHUB_STEP_SUMMARY"
      - uses: azure/login@v2
        if: ${{ inputs.run_ingest }}
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Ejecutar ingesta
        if: ${{ inputs.run_ingest }}
        working-directory: infra/apps
        run: |
          az containerapp job start \
            --name "$(terraform output -raw ingest_job_name)" \
            --resource-group "$(terraform output -raw resource_group_name)"
