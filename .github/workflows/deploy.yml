name: Deploy

# Despliegue en Azure: infraestructura (platform) → imágenes → apps → documentos de ejemplo.
#
# Login de la web con GitHub (OAuth App): variable GH_OAUTH_CLIENT_ID y secret
# GH_OAUTH_CLIENT_SECRET del environment dev; ADMINISTRADORES_GITHUB (JSON, opcional) con los
# primeros administradores (por defecto, el dueño del repositorio). Al terminar carga los
# documentos de ejemplo (idempotente) y comprueba que la web exige inicio de sesión.
# Con login de Entra ID (login_proveedor=entra) el stack identidad se aplica con make deploy.
#
# Desactivado hasta que se decida desplegar: requiere la variable de repositorio
# DEPLOY_AZURE=true (Settings → Variables). Sin ella, todos los jobs se omiten.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_ingest:
        description: Reindexar también desde Blob al terminar
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

# Credenciales de Azure (secrets del repositorio): AZURE_CLIENT_ID, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID y AZURE_CLIENT_SECRET (service principal). Sin AZURE_CLIENT_SECRET se
# usa OIDC (identidad del bootstrap, sin contraseña). Ver docs/despliegue.md.
env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_USE_OIDC: ${{ secrets.AZURE_CLIENT_SECRET == '' && 'true' || 'false' }}
  TF_IN_AUTOMATION: "true"
  # Estado remoto de Terraform (infra/envs/dev/backend.hcl); las variables TFSTATE_* lo cambian.
  BACKEND_CONFIG: >-
    -backend-config=resource_group_name=${{ vars.TFSTATE_RG || 'rg-ragseg-tfstate' }}
    -backend-config=storage_account_name=${{ vars.TFSTATE_ACCOUNT || 'stragsegtf08894c' }}
    -backend-config=container_name=${{ vars.TFSTATE_CONTAINER || 'tfstate' }}
    -backend-config=use_azuread_auth=true

jobs:
  platform:
    if: vars.DEPLOY_AZURE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    outputs:
      alcance: ${{ steps.out.outputs.alcance }}
      acr_name: ${{ steps.out.outputs.acr_name }}
      acr_login_server: ${{ steps.out.outputs.acr_login_server }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: az login (service principal)
        if: env.ARM_USE_OIDC == 'false'
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ env.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ env.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ env.ARM_TENANT_ID }}"}'
      - name: az login (OIDC)
        if: env.ARM_USE_OIDC == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
      - name: Región de PostgreSQL (la suscripción puede restringirlo por región)
        run: |
          source scripts/nube.sh --solo-funciones
          echo "TF_VAR_postgres_location=$(region_postgres)" >> "$GITHUB_ENV"
      - name: terraform apply (platform)
        working-directory: infra/platform
        run: |
          terraform init -input=false $BACKEND_CONFIG -backend-config=use_oidc=$ARM_USE_OIDC -backend-config=key=dev/platform.tfstate
          terraform apply -input=false -auto-approve -var-file=../envs/dev/nube.tfvars
        env:
          TF_VAR_langsmith_api_key: ${{ secrets.LANGSMITH_API_KEY }}
      - id: out
        working-directory: infra/platform
        run: |
          echo "alcance=$(terraform output -raw alcance)" >> "$GITHUB_OUTPUT"
          echo "acr_name=$(terraform output -raw acr_name)" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"

  images:
    needs: platform
    if: vars.DEPLOY_AZURE == 'true' && needs.platform.outputs.alcance == 'completo'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    steps:
      - uses: actions/checkout@v7
      - name: az login (service principal)
        if: env.ARM_USE_OIDC == 'false'
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ env.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ env.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ env.ARM_TENANT_ID }}"}'
      - name: az login (OIDC)
        if: env.ARM_USE_OIDC == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
      - run: az acr login --name ${{ needs.platform.outputs.acr_name }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ needs.platform.outputs.acr_login_server }}/backend:${{ github.sha }}
      - uses: docker/build-push-action@v7
        with:
          context: web
          push: true
          tags: ${{ needs.platform.outputs.acr_login_server }}/web:${{ github.sha }}

  apps:
    needs: [platform, images]
    if: vars.DEPLOY_AZURE == 'true' && needs.platform.outputs.alcance == 'completo'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Prompts en LangSmith (la app usa la etiqueta prod)
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          uv sync --frozen
          source scripts/comun.sh
          publicar_prompts dev prod
      - name: terraform apply (apps)
        working-directory: infra/apps
        env:
          REGISTRY: ${{ needs.platform.outputs.acr_login_server }}
          TF_VAR_github_oauth_client_id: ${{ vars.GH_OAUTH_CLIENT_ID }}
          TF_VAR_github_oauth_client_secret: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          TF_VAR_administradores: ${{ vars.ADMINISTRADORES_GITHUB || format('["{0}"]', github.repository_owner) }}
        run: |
          terraform init -input=false $BACKEND_CONFIG -backend-config=use_oidc=$ARM_USE_OIDC -backend-config=key=dev/apps.tfstate
          terraform apply -input=false -auto-approve \
            -var-file=../envs/dev/apps.tfvars \
            -var="backend_image=${REGISTRY}/backend:${GITHUB_SHA}" \
            -var="web_image=${REGISTRY}/web:${GITHUB_SHA}" \
            -var="app_version=${GITHUB_SHA}" \
            -var='platform_state={resource_group_name="${{ vars.TFSTATE_RG || 'rg-ragseg-tfstate' }}",storage_account_name="${{ vars.TFSTATE_ACCOUNT || 'stragsegtf08894c' }}",container_name="${{ vars.TFSTATE_CONTAINER || 'tfstate' }}",key="dev/platform.tfstate"}'
          echo "### Web: $(terraform output -raw web_url)" >> "$GITHUB_STEP_SUMMARY"
          echo "Callback de la OAuth App de GitHub: $(terraform output -raw web_url)/.auth/login/github/callback" >> "$GITHUB_STEP_SUMMARY"
      - name: az login (service principal)
        if: env.ARM_USE_OIDC == 'false'
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ env.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ env.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ env.ARM_TENANT_ID }}"}'
      - name: az login (OIDC)
        if: env.ARM_USE_OIDC == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
      - name: Documentos de ejemplo (registro + Blob + índice; idempotente)
        working-directory: infra/apps
        run: |
          job="$(terraform output -raw sembrar_job_name)"
          grupo="$(terraform output -raw resource_group_name)"
          az containerapp job start -n "$job" -g "$grupo" -o none
          for i in $(seq 1 60); do
            estado=$(az containerapp job execution list -n "$job" -g "$grupo" --query "[0].properties.status" -o tsv)
            [[ $estado == Succeeded || $estado == Failed ]] && break
            sleep 10
          done
          echo "Siembra: $estado" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ $estado == Succeeded ]] || { az containerapp job logs show -n "$job" -g "$grupo" --container sembrar 2>&1 | tail -50; exit 1; }
      - name: Comprobación (la web exige inicio de sesión)
        working-directory: infra/apps
        run: |
          url="$(terraform output -raw web_url)"
          for i in $(seq 1 30); do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" "$url/" || true)
            [[ $codigo == 302 || $codigo == 401 ]] && break
            sleep 10
          done
          echo "Web $url → $codigo" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ $codigo == 302 || $codigo == 401 ]]
      - name: Reindexar desde Blob
        if: ${{ inputs.run_ingest }}
        working-directory: infra/apps
        run: |
          az containerapp job start \
            --name "$(terraform output -raw ingest_job_name)" \
            --resource-group "$(terraform output -raw resource_group_name)"
